name: frontend-ci

on:
  push:
    branches: [main]
    paths: ["frontend/**", ".github/workflows/frontend-ci.yml"]
  pull_request:
    paths: ["frontend/**", ".github/workflows/frontend-ci.yml"]

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install (clean)
        run: npm ci
      - name: Guard - supported Next.js line
        run: npm run check:next
      - name: Guard regression test (15.5.23 거부 / 15.5.24 허용)
        run: npm run test:check-next
      - name: Audit (high+, prod deps)
        # next@15.x가 내부에 고정한 빌드타임 postcss 사본(GHSA-qx2v-qp2m-jg93 계열)은
        # next@16 메이저에서만 해소되므로, 여기서는 회귀 감지용으로 결과만 출력한다.
        run: npm audit --omit=dev --audit-level=high || true
      - name: Build
        run: npm run build
